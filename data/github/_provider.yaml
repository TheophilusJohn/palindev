# GitHub REST API. terms.status stays red until the maintainer rates it (D23).
id: github
name: GitHub
docs_url: https://docs.github.com/en
api_reference_url: https://docs.github.com/en/rest
openapi_url: https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/api.github.com/api.github.com.2026-03-10.json
changelog_url: https://github.blog/changelog/
versioning: "Date-based X-GitHub-Api-Version header; requests without it get 2022-11-28, and a version stays supported for 24 months after a newer one is released"
current_api_version: "2026-03-10"
terms_url: https://docs.github.com/en/site-policy/github-terms/github-terms-of-service
terms:
  status: red
  consent: null
  notes: >-
    Placeholder: only the maintainer raises this (D23). Proposed rating: green. Clauses read on
    2026-10-09, quoted in evidence. Testing and benchmarking: the Terms of Service, the Acceptable
    Use Policies and the Additional Product Terms have no clause that restricts testing the API in
    your own organization or publishing the results. The only benchmarking clause (Additional
    Product Terms, Competitive Benchmarking) applies to someone who offers a product competitive to
    a GitHub product, and asks only that they waive their own benchmarking restrictions; Palin's
    licenses (Apache-2.0 for code, CC BY 4.0 for data) have none. Publishing: Acceptable Use
    Policies section 7 lets researchers use public, non-personal information from the Service only
    if publications from that research are open access; Palin's records and traces are public under
    CC BY 4.0 and describe its own public test repositories. API terms (Terms of Service section H):
    no abusive or excessively frequent requests, no sharing tokens to exceed rate limits, and no
    downloading data for spam or for selling personal information; the harness sends at most one
    request per second in short runs. Accounts: Terms of Service section B allows one free machine
    account per person, which is the observer (D25). Commercial use is the clause to read closely:
    Acceptable Use Policies section 6 bars selling, reselling or exploiting any portion of the
    Service, use of the Service, or access to the Service without GitHub's written permission.
    Palin's paid offers (D19) sell its own observations and audits, not access to or copies of
    GitHub. If that reading is in doubt, rate it yellow until GitHub's written consent is on file.
sandbox:
  kind: test_account
  signup_url: https://docs.github.com/en/organizations/collaborating-with-groups-in-organizations/creating-a-new-organization-from-scratch
  cost: free
  notes: >-
    No test mode, test keys or key prefixes were found in GitHub's docs, so the sandbox is a
    dedicated test organization on GitHub Free with public repositories. The harness acts as a
    private GitHub App registered under that organization and installed only there, and observes
    through one machine account (D25). Secondary rate limits allow at most 80 content-generating
    requests a minute and 500 an hour.
